<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Goumble | Javier Andres Vargas, Software Engineer</title>
<meta name="description" content="Javier Andres Vargas is a full-stack software engineer in South Florida with a B.A. in Computer Science and a minor in Cybersecurity. Projects, resume and contact.">
<meta name="theme-color" content="#232323">
<link rel="canonical" href="https://thegoumble.com/">

<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="The Goumble">
<meta property="og:title" content="Javier Andres Vargas | Software Engineer">
<meta property="og:description" content="Full-stack software engineer in South Florida. Projects, resume and contact.">
<meta property="og:url" content="https://thegoumble.com/">
<meta property="og:image" content="https://thegoumble.com/assets/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://thegoumble.com/assets/icons/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Rubik:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/about.css">
<link rel="stylesheet" href="css/field.css">
<link rel="stylesheet" href="css/resume.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<canvas id="starfield" aria-hidden="true"></canvas>

<nav id="shipnav">
  <img id="shipSvg" src="assets/ship.svg" alt="spaceship">
  <div id="navLinks"></div>
  <a id="satellite" href="#resume" aria-label="Jump to my resume">
    <img src="assets/satellite.svg" alt="" draggable="false">
    <span class="sat-label">resume</span>
  </a>
</nav>

<main id="main">
<section id="hero">
  <div id="tetherLayer">
  <svg id="tetherSvg"><path id="tetherPath" d="" /></svg>
  <div id="character" title="Drag me">
    <img class="astro-img" src="assets/astronaut.svg" alt="" draggable="false">
  </div>
</div>
  <div id="heroText">
    <h1 id="heroName"></h1>
    <p id="heroRole"></p>
  </div>
</section>

<section id="about">
  <h2 class="sr-only">About</h2>
  <img class="bg-planet bg-planet-stars" loading="lazy" src="assets/about/planet-stars.svg" alt="">
  <img class="bg-planet bg-planet-maze" loading="lazy" src="assets/about/planet-maze.svg" alt="">
  <div id="planet">
    <div id="planetContent">
      <img id="headshot" alt="Javier Andres Vargas" />
      <img id="icon" alt="" />
      <div id="bioText"></div>
    </div>
  </div>
</section>

<section id="field">
  <div class="field-header">
    <h2 class="section-label">projects &amp; skills</h2>
    <button id="fieldViewToggle" class="view-toggle" aria-pressed="false"
      title="Switch between the asteroid view and a formal list">
      <span class="view-toggle-option view-toggle-option-left">asteroids</span>
      <span class="view-toggle-option view-toggle-option-right">formal</span>
    </button>
  </div>

  <div id="spaceView">
    <div id="spaceStage">
      <div id="skillDrift" aria-hidden="true"></div>
      <div id="rockCluster" role="group" aria-label="Projects"></div>
    </div>
    <article id="projectCard" class="proj-card" hidden aria-live="polite"></article>
  </div>

  <div id="formalView" hidden></div>
</section>

<section id="resume">
  <h2 class="section-label">resume</h2>
  <div class="resume-viewer">
    <object data="assets/resume.pdf#view=FitH" type="application/pdf">
      <p>Your browser can't show the PDF inline.</p>
    </object>
  </div>
  <a class="resume-btn" href="assets/resume.pdf" download>Download PDF</a>
</section>

<section id="contact">
  <div id="blackhole">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div id="bhCore"></div>
  </div>
  <p id="contactLabel">click to send a transmission</p>
  <ul id="socials" aria-label="Find me elsewhere"></ul>
</section>
</main>

<!-- load order matters: main.js calls functions defined in the others, so it must load last. -->
<script src="js/data.js"></script>
<script src="js/starfield.js"></script>
<script src="js/eyes/eyes.js"></script>
<script src="js/eyes/eyes-data.js"></script>
<script src="js/tether/AnchorTracker.js"></script>
<script src="js/tether/DriftZone.js"></script>
<script src="js/tether/DragController.js"></script>
<script src="js/tether/RopePhysics.js"></script>
<script src="js/tether/tether.js"></script>
<script src="js/nav.js"></script>
<script src="js/mobile.js"></script>
<script src="js/field.js"></script>
<script src="js/contact.js"></script>
<script src="js/main.js"></script>
</body>
</html>
